services:
  - type: web
    name: echolytix
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_KEY
        sync: false   # Set this manually in Render dashboard (Gemini API key, optional)
